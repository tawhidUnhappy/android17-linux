# Settings for the Android 17 phone. android17-setup.sh writes them into the phone's own config
# (data/avd/Android17.avd/config.ini); only the keys listed here are changed.
# Change one, run ./android17-setup.sh and start the phone again.

# The phone: a Pixel 10 Pro, upright.
avd.ini.displayname = Android 17
hw.initialOrientation = portrait

# Like a real Pixel: Google Play, front and back camera (without a webcam both show a test picture;
# the 3D-room camera "virtualscene" crashed the emulator with an NVIDIA card), no SD card.
PlayStore.enabled = true
hw.camera.back = emulated
hw.camera.front = emulated
hw.sdCard = no

# Speed: 6 CPU cores and 6 GB RAM (512 MB per big app, as on a Pixel); lower them on a smaller PC,
# for example 4 and 4096. The graphics card draws the screen; if it gives trouble, use
# hw.gpu.mode = swiftshader (drawn by the CPU: slower, but works everywhere).
hw.cpu.ncore = 6
hw.ramSize = 6144
vm.heapSize = 512M
hw.gpu.enabled = yes
hw.gpu.mode = host

# Storage for apps and files. The file on disk only grows as it fills up.
disk.dataPartition.size = 32G

# Typing with the PC keyboard; sound out and microphone in (android17.sh lets the PC's
# microphone through; apps still have to ask for it, as on a phone).
hw.keyboard = yes
hw.audioOutput = yes
hw.audioInput = yes

# Every start is a real start-up, never a saved state: closing the window is like pulling the battery.
fastboot.forceColdBoot = yes
fastboot.forceFastBoot = no
